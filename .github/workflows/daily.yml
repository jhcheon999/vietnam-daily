name: 매일 베트남어 카톡

on:
  # cron-job.org 등 외부에서 매일 정시에 트리거 (GitHub cron 지연/누락 대비)
  repository_dispatch:
    types: [send-daily]
  # 백업용 GitHub 예약 (늦거나 건너뛸 수 있음)
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 발송
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_ME: ${{ secrets.KAKAO_REFRESH_ME }}
        run: node send.js
