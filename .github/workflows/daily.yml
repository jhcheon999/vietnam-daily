name: 매일 베트남어 카톡

on:
  schedule:
    # UTC 기준. 05:15 UTC = 베트남(UTC+7) 12:15.
    - cron: '15 5 * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 발송
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_ME: ${{ secrets.KAKAO_REFRESH_ME }}
        run: node send.js
